# Runs the same harness checks the Claude Code hooks run, on every push to main and every pull
# request, so a commit made by a human or another tool can't skip them.
# See docs/wiki/architecture/quality-gates.md.
name: harness

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the repo; never hand PR code a token that can write.
permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/app
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the integrity check can diff against the base.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/app/package-lock.json

      - run: npm ci

      - name: harness check (full profile)
        env:
          # Integrity compares against the PR base, or the commit before a push to main.
          HARNESS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: npm run harness:check -- --profile full --report harness-report.json

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: src/app/harness-report.json
          if-no-files-found: ignore
