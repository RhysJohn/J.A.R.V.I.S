# Runs the same harness checks the Claude Code hooks run, on every push to main and every pull
# request, so a commit made by a human or another tool can't skip them.
# See docs/wiki/architecture/quality-gates.md.
name: harness

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/app/package-lock.json

      - run: npm ci

      - name: harness check (full profile)
        run: npm run harness:check -- --profile full --report harness-report.json

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: src/app/harness-report.json
          if-no-files-found: ignore
